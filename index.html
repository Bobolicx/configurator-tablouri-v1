<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Configurator tablouri electrice — V1</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f4f6f8;color:#17212b}
    header{display:flex;justify-content:space-between;align-items:center;padding:14px;background:#0f2942;color:#fff;flex-wrap:wrap;gap:8px}
    header h1{font-size:17px;margin:0}
    main{padding:14px;max-width:1100px;margin:0 auto}
    .card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
    button{border:0;border-radius:8px;padding:10px 14px;background:#1f6feb;color:#fff;font-weight:600;cursor:pointer}
    button.secondary{background:#e5e9ee;color:#17212b}
    button:disabled{opacity:.5}
    .steps{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
    .steps button{background:#e5e9ee;color:#17212b}
    .steps button.active{background:#1f6feb;color:#fff}
    label{display:block;font-size:13px;font-weight:600;margin:10px 0 5px}
    input,select{width:100%;padding:10px;border:1px solid #ccd4dd;border-radius:8px}
    .grid{display:grid;gap:12px}
    @media(min-width:800px){.grid{grid-template-columns:1fr 1fr}}
    .device{border:1px solid #dbe2ea;border-radius:10px;padding:10px;margin-bottom:8px;background:#fff}
    .device button{width:100%;margin-top:8px}
    .rail{display:flex;flex-direction:column;gap:8px;overflow-x:auto}
    .row{display:flex;gap:3px;background:#eef2f6;border:1px solid #d7dee6;border-radius:8px;padding:6px;min-height:58px}
    .slot{min-width:30px;height:46px;border:1px dashed #b9c4cf;border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;text-align:center;padding:2px}
    .slot.filled{background:#dbeafe;border-style:solid;border-color:#1f6feb}
    .warn{background:#fff7e6;border-left:4px solid #f59e0b;padding:10px;border-radius:8px;margin-top:10px}
    .ok{background:#dcfce7;border-left:4px solid #16a34a;padding:10px;border-radius:8px;margin-top:10px}
    .error{background:#fee2e2;border-left:4px solid #dc2626;padding:10px;border-radius:8px;margin-top:10px}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{border-bottom:1px solid #e3e8ee;padding:7px;text-align:left}
    footer{padding:16px;text-align:center;color:#5b6b7b;font-size:12px}
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

const panels = [
  { id:"p12", sku:"TAB-12A", name:"Tablou aplicat 12 module", mounting:"aplicat", rows:1, modulesPerRow:12, stock:8 },
  { id:"p24", sku:"TAB-24I", name:"Tablou incastrabil 24 module", mounting:"incasabil", rows:2, modulesPerRow:12, stock:5 },
  { id:"p36", sku:"TAB-36A", name:"Tablou aplicat 36 module", mounting:"aplicat", rows:2, modulesPerRow:18, stock:3 },
  { id:"p48", sku:"TAB-48I", name:"Tablou incastrabil 48 module", mounting:"incasabil", rows:4, modulesPerRow:12, stock:2 }
];

const devices = [
  { id:"gen1", sku:"IG-1P-40", name:"Întrerupător general 1P 40 A", category:"general", modules:2, stock:10 },
  { id:"gen3", sku:"IG-3P-63", name:"Întrerupător general 3P 63 A", category:"general", modules:3, stock:6 },
  { id:"mcb10", sku:"MCB-1P-10", name:"Automat 1P 10 A", category:"mcb", modules:1, stock:50 },
  { id:"mcb16", sku:"MCB-1P-16", name:"Automat 1P 16 A", category:"mcb", modules:1, stock:50 },
  { id:"mcb20", sku:"MCB-1P-20", name:"Automat 1P 20 A", category:"mcb", modules:1, stock:40 },
  { id:"rcd2", sku:"RCD-2P-40", name:"Diferențial 2P 40 A 30 mA", category:"rcd", modules:2, stock:12 },
  { id:"rcd4", sku:"RCD-4P-63", name:"Diferențial 4P 63 A 30 mA", category:"rcd", modules:4, stock:4 },
  { id:"rcbo", sku:"RCBO-1PN-16", name:"Comutator diferențial 1P+N 16 A", category:"rcbo", modules:2, stock:15 },
  { id:"spd", sku:"SPD-T2", name:"Parafulnere tip 2", category:"spd", modules:2, stock:5 }
];

const STORAGE_KEY = "configurator-tablouri-v1";

function App() {
  const [step, setStep] = useState(1);
  const [phase, setPhase] = useState("monofazic");
  const [power, setPower] = useState("");
  const [panelId, setPanelId] = useState(null);
  const [placed, setPlaced] = useState([]);
  const [selectedUid, setSelectedUid] = useState(null);

  useEffect(() => {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const data = JSON.parse(saved);
      setPhase(data.phase || "monofazic");
      setPower(data.power || "");
      setPanelId(data.panelId || null);
      setPlaced(data.placed || []);
    }
  }, []);

  useEffect(() => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ phase, power, panelId, placed }));
  }, [phase, power, panelId, placed]);

  const panel = panels.find(p => p.id === panelId) || null;
  const usedModules = placed.reduce((sum, item) => {
    const device = devices.find(d => d.id === item.deviceId);
    return sum + (device ? device.modules : 0);
  }, 0);
  const capacity = panel ? panel.rows * panel.modulesPerRow : 0;
  const current = power
    ? phase === "monofazic"
      ? power * 1000 / 230
      : power * 1000 / (Math.sqrt(3) * 400)
    : null;

  function addDevice(deviceId) {
    if (!panel) return;
    const device = devices.find(d => d.id === deviceId);

    for (let row = 0; row < panel.rows; row++) {
      for (let pos = 0; pos <= panel.modulesPerRow - device.modules; pos++) {
        const busy = placed.some(item => {
          if (item.row !== row) return false;
          const other = devices.find(d => d.id === item.deviceId);
          return pos < item.pos + other.modules && item.pos < pos + device.modules;
        });

        if (!busy) {
          setPlaced([
            ...placed,
            { uid: Date.now() + "-" + Math.random(), deviceId, row, pos, circuit: "Circuit nou" }
          ]);
          return;
        }
      }
    }
    alert("Nu există spațiu liber suficient.");
  }

  function removeDevice(uid) {
    setPlaced(placed.filter(item => item.uid !== uid));
    setSelectedUid(null);
  }

  function moveDevice(uid, direction) {
    setPlaced(placed.map(item =>
      item.uid === uid
        ? { ...item, row: Math.min(Math.max(0, item.row + direction), panel.rows - 1) }
        : item
    ));
  }

  const selected = placed.find(item => item.uid === selectedUid);
  const selectedDevice = selected ? devices.find(d => d.id === selected.deviceId) : null;

  const validations = [];
  if (!power) validations.push({ type:"warn", text:"Introduceți puterea instalată." });
  else validations.push({ type:"ok", text:"Curent estimativ: " + current.toFixed(1) + " A" });

  if (!panel) validations.push({ type:"error", text:"Selectați un tablou." });
  else if (usedModules > capacity) validations.push({ type:"error", text:"Modulele depășesc capacitatea tabloului." });
  else validations.push({ type:"ok", text:"Module ocupate: " + usedModules + "/" + capacity });

  if (!placed.some(item => devices.find(d => d.id === item.deviceId).category === "general"))
    validations.push({ type:"warn", text:"Nu există întrerupător general." });

  if (!placed.some(item => ["rcd","rcbo"].includes(devices.find(d => d.id === item.deviceId).category)))
    validations.push({ type:"warn", text:"Nu există protecție diferențială." });

  return (
    <>
      <header>
        <h1>Configurator tablouri electrice — V1</h1>
        <button className="secondary" onClick={() => {
          localStorage.removeItem(STORAGE_KEY);
          setStep(1); setPhase("monofazic"); setPower(""); setPanelId(null); setPlaced([]);
        }}>Configurare nouă</button>
      </header>

      <main>
        <div className="steps">
          {[1,2,3,4].map(n => (
            <button key={n} className={step === n ? "active" : ""} onClick={() => setStep(n)}>
              Pasul {n}
            </button>
          ))}
        </div>

        {step === 1 && (
          <div className="card">
            <h2>Pasul 1 — Branșament</h2>
            <label>Tip branșament</label>
            <select value={phase} onChange={e => setPhase(e.target.value)}>
              <option value="monofazic">Monofazic 230 V</option>
              <option value="trifazic">Trifazic 400 V</option>
            </select>

            <label>Putere instalată (kW)</label>
            <input type="number" value={power} onChange={e => setPower(e.target.value)} />

            {current && <div className="ok">Curent estimativ: {current.toFixed(1)} A</div>}

            <p className="warn">Calcul orientativ. Verificarea finală se face conform I7 de către personal autorizat.</p>
            <button onClick={() => setStep(2)}>Continuă</button>
          </div>
        )}

        {step === 2 && (
          <div className="card">
            <h2>Pasul 2 — Alegerea tabloului</h2>
            {panels.map(p => (
              <div key={p.id} className="device">
                <strong>{p.name}</strong>
                <p>{p.mounting} · {p.rows} rânduri × {p.modulesPerRow} module · stoc: {p.stock}</p>
                <button className={panelId === p.id ? "" : "secondary"} onClick={() => setPanelId(p.id)}>
                  {panelId === p.id ? "Selectat" : "Selectează"}
                </button>
              </div>
            ))}
            <button disabled={!panelId} onClick={() => setStep(3)}>Continuă</button>
          </div>
        )}

        {step === 3 && (
          <div className="card">
            <h2>Pasul 3 — Echiparea tabloului</h2>

            <h3>Catalog</h3>
            {devices.map(d => (
              <div key={d.id} className="device">
                <strong>{d.name}</strong>
                <p>{d.modules} module · stoc: {d.stock}</p>
                <button onClick={() => addDevice(d.id)}>Adaugă</button>
              </div>
            ))}

            <h3>{panel ? panel.name : "Niciun tablou selectat"}</h3>
            <div className="rail">
              {panel && Array.from({ length: panel.rows }).map((_, row) => (
                <div key={row} className="row">
                  {Array.from({ length: panel.modulesPerRow }).map((_, pos) => {
                    const item = placed.find(p => {
                      const d = devices.find(x => x.id === p.deviceId);
                      return p.row === row && pos >= p.pos && pos < p.pos + d.modules;
                    });
                    const device = item ? devices.find(d => d.id === item.deviceId) : null;
                    return (
                      <div
                        key={pos}
                        className={"slot " + (item ? "filled" : "")}
                        onClick={() => item && setSelectedUid(item.uid)}
                      >
                        {item ? device.sku : pos + 1}
                      </div>
                    );
                  })}
                </div>
              ))}
            </div>

            <p><strong>Module ocupate:</strong> {usedModules}/{capacity}</p>

            {selected && (
              <div className="device">
                <strong>{selectedDevice.name}</strong>
                <p>Rândul {selected.row + 1}, poziția {selected.pos + 1}</p>
                <label>Denumire circuit</label>
                <input
                  value={selected.circuit}
                  onChange={e => setPlaced(placed.map(item =>
                    item.uid === selected.uid ? { ...item, circuit: e.target.value } : item
                  ))}
                />
                <button className="secondary" onClick={() => moveDevice(selected.uid, -1)}>Mută sus</button>
                <button className="secondary" onClick={() => moveDevice(selected.uid, 1)}>Mută jos</button>
                <button onClick={() => removeDevice(selected.uid)}>Șterge</button>
              </div>
            )}

            <button className="secondary" onClick={() => setStep(2)}>Înapoi</button>
            <button disabled={!panel} onClick={() => setStep(4)}>Continuă</button>
          </div>
        )}

        {step === 4 && (
          <div className="card">
            <h2>Pasul 4 — Rezumat</h2>

            <div className="rail">
              {panel && Array.from({ length: panel.rows }).map((_, row) => (
                <div key={row} className="row">
                  {Array.from({ length: panel.modulesPerRow }).map((_, pos) => {
                    const item = placed.find(p => {
                      const d = devices.find(x => x.id === p.deviceId);
                      return p.row === row && pos >= p.pos && pos < p.pos + d.modules;
                    });
                    const device = item ? devices.find(d => d.id === item.deviceId) : null;
                    return <div key={pos} className={"slot " + (item ? "filled" : "")}>{item ? device.sku : ""}</div>;
                  })}
                </div>
              ))}
            </div>

            <h3>Listă materiale — fără prețuri</h3>
            <table>
              <thead><tr><th>Produs</th><th>SKU</th><th>Module</th><th>Circuit</th></tr></thead>
              <tbody>
                {panel && <tr><td>{panel.name}</td><td>{panel.sku}</td><td>{capacity}</td><td>Tablou</td></tr>}
                {placed.map(item => {
                  const d = devices.find(x => x.id === item.deviceId);
                  return <tr key={item.uid}><td>{d.name}</td><td>{d.sku}</td><td>{d.modules}</td><td>{item.circuit}</td></tr>;
                })}
              </tbody>
            </table>

            <h3>Verificări orientative</h3>
            {validations.map((v, i) => <div key={i} className={v.type}>{v.text}</div>)}

            <p className="warn">Prețurile și manopera de realizare în atelier se calculează după salvarea în cont.</p>
            <button className="secondary" onClick={() => setStep(3)}>Înapoi</button>
            <button disabled>Salvează și descarcă PDF</button>
          </div>
        )}
      </main>

      <footer>Configurare orientativă. Execuția finală trebuie verificată conform I7.</footer>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
