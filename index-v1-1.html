<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Configurator tablouri electrice — V1.1</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f2f5f8;color:#16232e}
header{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;background:#0d2b45;color:#fff}
header h1{font-size:16px;margin:0}
main{padding:12px;max-width:1150px;margin:0 auto;padding-bottom:90px}
.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 3px 10px rgba(13,43,69,.08);margin-bottom:14px}
button{border:0;border-radius:10px;padding:11px 14px;background:#1f6feb;color:#fff;font-weight:700;cursor:pointer;font-size:14px}
button.ghost{background:#e8edf3;color:#16232e}
button.danger{background:#e11d48}
button:disabled{opacity:.45;cursor:not-allowed}
.steps{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.steps button{background:#e8edf3;color:#16232e;white-space:nowrap}
.steps button.active{background:#1f6feb;color:#fff}
label{display:block;font-size:12px;font-weight:700;margin:10px 0 5px;color:#41525f}
input,select{width:100%;padding:12px;border:1px solid #c9d3dd;border-radius:10px;font-size:15px}
.panel-card{border:2px solid #dfe6ee;border-radius:14px;padding:12px;margin-bottom:10px;background:#fff}
.panel-card.selected{border-color:#1f6feb;background:#f2f8ff}
.panel-visual{display:flex;flex-direction:column;gap:4px;margin:10px 0}
.panel-row{display:flex;gap:3px}
.module{height:22px;flex:1;background:#e9eef4;border-radius:4px}
.filters{display:flex;gap:8px;margin-bottom:12px}
.filters button{flex:1;background:#e8edf3;color:#16232e;font-size:13px}
.filters button.active{background:#0d2b45;color:#fff}
.rail{display:flex;flex-direction:column;gap:8px;overflow-x:auto;padding:4px}
.row{display:flex;gap:3px;background:#f5f8fb;border:1px solid #d9e1e9;border-radius:12px;padding:6px;min-height:64px}
.slot{min-width:32px;height:52px;border:1px dashed #b6c3cf;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:8px;text-align:center;padding:2px;cursor:pointer}
.slot.filled{border-style:solid;cursor:pointer}
.slot.general{background:#dbeafe;border-color:#1d4ed8;color:#1d4ed8}
.slot.mcb{background:#dcfce7;border-color:#15803d;color:#15803d}
.slot.rcd,.slot.rcbo{background:#fef3c7;border-color:#b45309;color:#b45309}
.slot.spd{background:#ede9fe;border-color:#7c3aed;color:#7c3aed}
.slot.selected{outline:3px solid #1f6feb}
.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;margin:10px 0}
.legend span{padding:4px 8px;border-radius:20px;background:#eef2f6}
.device{border:1px solid #dbe2ea;border-radius:12px;padding:10px;margin-bottom:8px;background:#fff}
.device button{width:100%;margin-top:8px}
.bottom-bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #dfe6ee;padding:10px 12px;display:flex;gap:8px;justify-content:space-between;align-items:center;z-index:30}
.bottom-bar small{display:block;color:#5b6b7b}
.warn{background:#fff7e6;border-left:4px solid #f59e0b;padding:10px;border-radius:8px;margin-top:10px;font-size:13px}
.ok{background:#dcfce7;border-left:4px solid #16a34a;padding:10px;border-radius:8px;margin-top:10px;font-size:13px}
.error{background:#fee2e2;border-left:4px solid #dc2626;padding:10px;border-radius:8px;margin-top:10px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border-bottom:1px solid #e3e8ee;padding:7px;text-align:left}
footer{padding:14px;text-align:center;color:#5b6b7b;font-size:11px}
h3{margin:14px 0 8px;font-size:15px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect} = React;

const panels=[
{id:"p12",sku:"TAB-12A",name:"Tablou aplicat 12 module",mounting:"aplicat",rows:1,modulesPerRow:12,stock:8},
{id:"p24",sku:"TAB-24I",name:"Tablou incastrabil 24 module",mounting:"incasabil",rows:2,modulesPerRow:12,stock:5},
{id:"p36",sku:"TAB-36A",name:"Tablou aplicat 36 module",mounting:"aplicat",rows:2,modulesPerRow:18,stock:3},
{id:"p48",sku:"TAB-48I",name:"Tablou incastrabil 48 module",mounting:"incasabil",rows:4,modulesPerRow:12,stock:2}
];

const devices=[
{id:"gen1",sku:"IG-1P-40",name:"Întrerupător general 1P 40 A",category:"general",modules:2,stock:10},
{id:"gen3",sku:"IG-3P-63",name:"Întrerupător general 3P 63 A",category:"general",modules:3,stock:6},
{id:"mcb10",sku:"MCB-1P-10",name:"Automat 1P 10 A",category:"mcb",modules:1,stock:50},
{id:"mcb16",sku:"MCB-1P-16", name:"Automat 1P 16 A",category:"mcb",modules:1,stock:50},
{id:"mcb20",sku:"MCB-1P-20",name:"Automat 1P 20 A",category:"mcb",modules:1,stock:40},
{id:"rcd2",sku:"RCD-2P-40",name:"Diferențial 2P 40 A 30 mA",category:"rcd",modules:2,stock:12},
{id:"rcd4",sku:"RCD-4P-63",name:"Diferențial 4P 63 A 30 mA",category:"rcd",modules:4,stock:4},
{id:"rcbo",sku:"RCBO-1PN-16",name:"Comutator diferențial 1P+N 16 A",category:"rcbo",modules:2,stock:15},
{id:"spd",sku:"SPD-T2",name:"Parafulnere tip 2",category:"spd",modules:2,stock:5}
];

const KEY="configurator-tablouri-v1-1";

function App(){
const[step,setStep]=useState(1);
const[phase,setPhase]=useState("monofazic");
const[power,setPower]=useState("");
const[panelId,setPanelId]=useState(null);
const[placed,setPlaced]=useState([]);
const[selectedUid,setSelectedUid]=useState(null);
const[filter,setFilter]=useState("toate");
const[picker,setPicker]=useState(null);

useEffect(()=>{
const s=localStorage.getItem(KEY);
if(s){const d=JSON.parse(s);setPhase(d.phase||"monofazic");setPower(d.power||"");setPanelId(d.panelId||null);setPlaced(d.placed||[])}
},[]);

useEffect(()=>{localStorage.setItem(KEY,JSON.stringify({phase,power,panelId,placed}))},[phase,power,panelId,placed]);

const panel=panels.find(p=>p.id===panelId)||null;
const capacity=panel?panel.rows*panel.modulesPerRow:0;
const used=placed.reduce((s,i)=>{const d=devices.find(x=>x.id===i.deviceId);return s+(d?d.modules:0)},0);
const current=power?(phase==="monofazic"?power*1000/230:power*1000/(Math.sqrt(3)*400)):null;

function isFree(row,pos,modules){
if(!panel||pos+modules>panel.modulesPerRow)return false;
return !placed.some(i=>{
if(i.row!==row)return false;
const d=devices.find(x=>x.id===i.deviceId);
return pos<i.pos+d.modules&&i.pos<pos+modules;
});
}

function addAt(deviceId,row,pos){
const d=devices.find(x=>x.id===deviceId);
if(!isFree(row,pos,d.modules)){alert("Nu există spațiu suficient aici.");return}
setPlaced([...placed,{uid:Date.now()+"-"+Math.random(),deviceId,row,pos,circuit:"Circuit nou"}]);
setPicker(null);
}

function tapSlot(row,pos){
const item=placed.find(i=>{
const d=devices.find(x=>x.id===i.deviceId);
return i.row===row&&pos>=i.pos&&pos<i.pos+d.modules;
});
if(item){setSelectedUid(item.uid);setPicker(null);return}
setSelectedUid(null);
setPicker({row,pos});
}

function move(uid,dir){
setPlaced(placed.map(i=>i.uid===uid?{...i,row:Math.min(Math.max(0,i.row+direction),panel.rows-1)}:i));
}

const selected=placed.find(i=>i.uid===selectedUid);
const selectedDevice=selected?devices.find(d=>d.id===selected.deviceId):null;

const checks=[];
if(!power)checks.push({t:"warn",m:"Introduceți puterea instalată."});
else checks.push({t:"ok",m:"Curent estimativ: "+current.toFixed(1)+" A"});
if(!panel)checks.push({t:"error",m:"Selectați un tablou."});
else if(used>capacity)checks.push({t:"error",m:"Modulele depășesc capacitatea tabloului."});
else checks.push({t:"ok",m:"Module ocupate: "+used+"/"+capacity});
if(!placed.some(i=>devices.find(d=>d.id===i.deviceId).category==="general"))checks.push({t:"warn",m:"Nu există întrerupător general."});
if(!placed.some(i=>["rcd","rcbo"].includes(devices.find(d=>d.id===i.deviceId).category)))checks.push({t:"warn",m:"Nu există protecție diferențială."});

const visiblePanels=panels.filter(p=>filter==="toate"||p.mounting===filter);

return (
<>
<header>
<h1>Configurator tablouri — V1.1</h1>
<button className="ghost" onClick={()=>{localStorage.removeItem(KEY);setStep(1);setPhase("monofazic");setPower("");setPanelId(null);setPlaced([])}}>Nou</button>
</header>

<main>
<div className="steps">
{[1,2,3,4].map(n=><button key={n} className={step===n?"active":""} onClick={()=>setStep(n)}>Pasul {n}</button>)}
</div>

{step===1&&(
<div className="card">
<h2>Branșament</h2>
<label>Tip branșament</label>
<select value={phase} onChange={e=>setPhase(e.target.value)}>
<option value="monofazic">Monofazic 230 V</option>
<option value="trifazic">Trifazic 400 V</option>
</select>
<label>Putere instalată (kW)</label>
<input type="number" inputMode="decimal" value={power} onChange={e=>setPower(e.target.value)}/>
{current&&<div className="ok">Curent estimativ: {current.toFixed(1)} A</div>}
<p className="warn">Calcul orientativ. Verificarea finală se realizează conform I7.</p>
</div>
)}

{step===2&&(
<div className="card">
<h2>Alege tabloul</h2>
<div className="filters">
{["toate","incasabil","aplicat"].map(f=>(
<button key={f} className={filter===f?"active":""} onClick={()=>setFilter(f)}>
{f==="toate"?"Toate":f==="incasabil"?"Încastrat":"Aplicat"}
</button>
))}
</div>

{visiblePanels.map(p=>(
<div key={p.id} className={"panel-card "+(panelId===p.id?"selected":"")} onClick={()=>setPanelId(p.id)}>
<strong>{p.name}</strong>
<p>{p.sku} · {p.mounting} · stoc: {p.stock}</p>
<div className="panel-visual">
{Array.from({length:p.rows}).map((_,r)=>(
<div key={r} className="panel-row">
{Array.from({length:p.modulesPerRow}).map((_,m)=><div key={m} className="module"></div>)}
</div>
))}
</div>
<button className={panelId===p.id?"":"ghost"} onClick={()=>setPanelId(p.id)}>
{panelId===p.id?"Selectat":"Selectează"}
</button>
</div>
))}
</div>
)}

{step===3&&(
<div className="card">
<h2>Echipare tablou</h2>
<p>Atinge un modul liber pentru a alege aparatul.</p>

<div className="rail">
{panel&&Array.from({length:panel.rows}).map((_,row)=>(
<div key={row} className="row">
{Array.from({length:panel.modulesPerRow}).map((_,pos)=>{
const item=placed.find(i=>{
const d=devices.find(x=>x.id===i.deviceId);
return i.row===row&&pos>=i.pos&&pos<i.pos+d.modules;
});
const device=item?devices.find(d=>d.id===item.deviceId):null;
return(
<div
key={pos}
className={
"slot "+(item?("filled "+device.category):"")+(selectedUid===item?.uid?" selected":"")
}
onClick={()=>tapSlot(row,pos)}
>
{item?device.sku:"+"}
</div>
);
})}
</div>
))}
</div>

<div className="legend">
<span>Albastru: general</span>
<span>Verde: automat</span>
<span>Galben: diferențial</span>
<span>Mov: parafulnere</span>
</div>

<p><strong>Module:</strong> {used}/{capacity}</p>

{picker&&(
<div className="device">
<h3>Alege aparatul</h3>
<p>Rândul {picker.row+1}, poziția {picker.pos+1}</p>
{devices.map(d=>(
<div key={d.id} className="device">
<strong>{d.name}</strong>
<p>{d.modules} module · stoc: {d.stock}</p>
<button onClick={()=>addAt(d.id,picker.row,picker.pos)}>Adaugă aici</button>
</div>
))}
<button className="ghost" onClick={()=>setPicker(null)}>Anulează</button>
</div>
)}

{selected&&(
<div className="device">
<h3>Aparat selectat</h3>
<strong>{selectedDevice.name}</strong>
<p>Rândul {selected.row+1}, poziția {selected.pos+1}</p>
<label>Denumire circuit</label>
<input value={selected.circuit} onChange={e=>setPlaced(placed.map(i=>i.uid===selected.uid?{...i,circuit:e.target.value}:i))}/>
<button className="ghost" onClick={()=>move(selected.uid,-1)}>Mută sus</button>
<button className="ghost" onClick={()=>move(selected.uid,1)}>Mută jos</button>
<button className="danger" onClick={()=>{setPlaced(placed.filter(i=>i.uid!==selected.uid));setSelectedUid(null)}}>Șterge</button>
</div>
)}
</div>
)}

{step===4&&(
<div className="card">
<h2>Rezumat tehnic</h2>

<div className="rail">
{panel&&Array.from({length:panel.rows}).map((_,row)=>(
<div key={row} className="row">
{Array.from({length:panel.modulesPerRow}).map((_,pos)=>{
const item=placed.find(i=>{
const d=devices.find(x=>x.id===i.deviceId);
return i.row===row&&pos>=i.pos&&pos<i.pos+d.modules;
});
const device=item?devices.find(d=>d.id===item.deviceId):null;
return <div key={pos} className={"slot "+(item?("filled "+device.category):"")}>{item?device.sku:""}</div>;
})}
</div>
))}
</div>

<h3>Listă materiale</h3>
<table>
<thead><tr><th>Produs</th><th>SKU</th><th>Module</th><th>Circuit</th></tr></thead>
<tbody>
{panel&&<tr><td>{panel.name}</td><td>{panel.sku}</td><td>{capacity}</td><td>Tablou</td></tr>}
{placed.map(i=>{
const d=devices.find(x=>x.id===i.deviceId);
return <tr key={i.uid}><td>{d.name}</td><td>{d.sku}</td><td>{d.modules}</td><td>{i.circuit}</td></tr>;
})}
</tbody>
</table>

<h3>Verificări</h3>
{checks.map((c,i)=><div key={i} className={c.t}>{c.m}</div>)}

<p className="warn">Prețurile și manopera de realizare în atelier se calculează după salvarea în cont.</p>
</div>
)}
</main>

<div className="bottom-bar">
<small>{panel?panel.name:"Niciun tablou selectat"}<br/>{used}/{capacity} module</small>
<div>
{step>1&&<button className="ghost" onClick={()=>setStep(step-1)}>Înapoi</button>}
{step<4&&<button disabled={step===2&&!panelId} onClick={()=>setStep(step+1)}>Continuă</button>}
</div>
</div>

<footer>Configurare orientativă. Execuția finală trebuie verificată conform I7.</footer>
</>
);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
